[package]
name = "snark_stms"
version = "0.1.0"
edition = "2024"

[dependencies]
ff = "0.13"
group = "0.13"
rand = "0.8"
rand_core = { version = "0.6", default-features = false }
num-bigint = { version = "0.4" }
num-traits = "0.2"
num-integer = "0.1"

midnight-circuits = { git = "https://github.com/midnightntwrk/midnight-zk", rev = "c3e8432" }
midnight-curves = { git = "https://github.com/midnightntwrk/midnight-zk", rev = "c3e8432" }
midnight-proofs = { git = "https://github.com/midnightntwrk/midnight-zk", rev = "c3e8432" }
midnight-zk-stdlib = { git = "https://github.com/midnightntwrk/midnight-zk", rev = "c3e8432" }
halo2curves = { version = "0.7.0", default-features = false }

thiserror = "2.0.12"
rug = { version = "1.27.0" }

[dev-dependencies]
criterion = "0.4.0"
blake2b_simd = "1" # MSRV 1.66.0
subtle = "2.5.0"
blst = { version = "0.3.14", features = ["portable"] }
blake2 = "0.10.6"
digest = { version = "0.10.7", features = ["alloc"] }

[features]
default = ["truncated-challenges"]
# Compatibility alias: this Midnight revision always truncates challenges.
truncated-challenges = []

# Unify compatible transitive Midnight dependencies at the pinned revision.
# SHA3 also retains a separate legacy midnight-curves 0.2 dependency.
[patch.crates-io]
midnight-circuits = { git = "https://www.github.com/midnightntwrk/midnight-zk", rev = "c3e8432" }
midnight-curves = { git = "https://www.github.com/midnightntwrk/midnight-zk", rev = "c3e8432" }
midnight-proofs = { git = "https://www.github.com/midnightntwrk/midnight-zk", rev = "c3e8432" }

# The SHA3 dependency follows Midnight's main branch. Cargo requires a distinct
# source URL to patch a Git dependency, so use GitHub's equivalent www hostname.
[patch."https://github.com/midnightntwrk/midnight-zk"]
midnight-circuits = { git = "https://www.github.com/midnightntwrk/midnight-zk", rev = "c3e8432" }
midnight-curves = { git = "https://www.github.com/midnightntwrk/midnight-zk", rev = "c3e8432" }
midnight-proofs = { git = "https://www.github.com/midnightntwrk/midnight-zk", rev = "c3e8432" }
midnight-zk-stdlib = { git = "https://www.github.com/midnightntwrk/midnight-zk", rev = "c3e8432" }

[[bench]]
name = "schnorr"
harness = false

[[bench]]
name = "bls"
harness = false

[[bench]]
name = "certificates"
harness = false

[[bench]]
name = "ivc"
harness = false
