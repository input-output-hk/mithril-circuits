[package]
name = "mithril-circuits"
version = "0.1.0"
edition = "2024"

[dependencies]
ff = "0.13"
group = "0.13"
rand = "0.8"
rand_core = { version = "0.6", default-features = false }
blake2b_simd = "1" # MSRV 1.66.0
subtle = "2.5.0"
num-bigint = { version = "0.4" }
num-traits = "0.2"
num-integer = "0.1"

midnight-circuits = { version = "7.2.4" }
midnight-curves = { version = "0.3.1" }
midnight-proofs = { version = "0.8.2" }
midnight-zk-stdlib = { version = "2.3.5" }
halo2curves = { version = "0.7.0", default-features = false }

thiserror = "2.0.12"
dashu = "0.4"
serde = { version = "1.0.228", features = ["derive", "rc"] }
sha2 = "0.10.9"

[dev-dependencies]
criterion = "0.4.0"
rand_chacha = "0.3.1"
blst = { version = "0.3.14", features = ["portable"] }
blake2 = "0.10.6"
digest = { version = "0.10.7", features = ["alloc"] }

[features]
default = ["truncated-challenges"]
truncated-challenges = ["midnight-circuits/truncated-challenges", "midnight-proofs/truncated-challenges"]

# Use the kitounliu/midnight-zk fork instead of crates.io. A patch (rather than
# `git = ...` in [dependencies]) is required so that the transitive
# midnight-proofs/midnight-circuits/midnight-curves used by midnight-zk-stdlib
# (and by blake2b_halo2) resolve to the same crate instance; otherwise two
# isomorphic copies get built and types fail to unify.
[patch.crates-io]
midnight-proofs = { git = "https://github.com/kitounliu/midnight-zk", branch = "kitoun@msm-blst-no-threshold-v2" }
midnight-curves = { git = "https://github.com/kitounliu/midnight-zk", branch = "kitoun@msm-blst-no-threshold-v2" }
midnight-circuits = { git = "https://github.com/kitounliu/midnight-zk", branch = "kitoun@msm-blst-no-threshold-v2" }
midnight-zk-stdlib = { git = "https://github.com/kitounliu/midnight-zk", branch = "kitoun@msm-blst-no-threshold-v2" }

[[bench]]
name = "signature"
harness = false

[[bench]]
name = "bls"
harness = false