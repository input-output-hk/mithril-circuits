[package]
name = "mithril-circuits"
version = "0.1.0"
edition = "2024"

[dependencies]
ff = "0.13"
group = "0.13"
rand = "0.8"
rand_core = { version = "0.6", default-features = false }
blake2b_simd = "1" # MSRV 1.66.0
subtle = "2.5.0"
num-bigint = { version = "0.4" }
num-traits = "0.2"
num-integer = "0.1"

midnight-circuits = { version = "6.1.0" }
midnight-curves = { version = "0.2.0" }
midnight-proofs = { version = "0.7.1" }
midnight-zk-stdlib = { version = "1.1.0" }
halo2curves = { version = "0.7.0", default-features = false }

thiserror = "2.0.12"
rug = { version = "1.27.0" }
serde = { version = "1.0.228", features = ["derive", "rc"] }
sha2 = "0.10.9"

[dev-dependencies]
criterion = "0.4.0"
rand_chacha = "0.3.1"
blst = { version = "0.3.14", features = ["portable"] }
blake2 = "0.10.6"
digest = { version = "0.10.7", features = ["alloc"] }

[features]
default = ["truncated-challenges"]
truncated-challenges = ["midnight-circuits/truncated-challenges", "midnight-proofs/truncated-challenges"]

[[bench]]
name = "signature"
harness = false

[[bench]]
name = "bls"
harness = false