name: IVC CI Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ivc-ci-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run IVC CI tests
        run: cargo test --release test_timings::ci_tests -- --nocapture

      - name: Run IVC slow tier tests (aggregator + verify)
        run: cargo test --release test_timings::aggregator_test -- --include-ignored --nocapture
