name: IVC CI Tests

on:
  push:
    branches: [main, curiecrypt/ivc-test-mode]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  SCCACHE_GHA_ENABLED: true
  RUSTC_WRAPPER: sccache
  RUSTFLAGS: --cap-lints allow

jobs:
  ivc-ci-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.7

      - name: Run CI-tier timing
        run: cargo test --release test_timings::gh_runner_timing::ci_tier_timings -- --include-ignored --nocapture

      - name: Run slow-tier timing
        run: cargo test --release test_timings::gh_runner_timing::slow_tier_timings -- --include-ignored --nocapture
